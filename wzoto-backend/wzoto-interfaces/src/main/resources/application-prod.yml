# =============================================
# 生产环境配置 (Render/Koyeb/免费云服务器)
# 使用 H2 内存数据库，启动时自动建表+灌入种子数据
# 激活方式: --spring.profiles.active=prod
# =============================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  # 禁用 Redis（生产环境无免费 Redis）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  # H2 内存数据库（MySQL 兼容模式）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:wzoto;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER,ORDER,STATUS,KEY,VALUE,LEVEL,TYPE,SCORE,COMMENT
    username: sa
    password:
  # 禁用 Spring Boot 自动初始化（由 DataInitializer 手动控制顺序）
  sql:
    init:
      mode: never
  # H2 Console（调试用，生产可关闭）
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 学霸到家自定义配置
wzoto:
  jwt:
    secret: ${JWT_SECRET:wzoto-production-jwt-secret-key-must-be-at-least-32-chars}
    expiration-hours: 72
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-3.5-turbo}
    temperature: ${AI_TEMPERATURE:0.7}

logging:
  level:
    com.wzoto: info
    com.baomidou.mybatisplus: warn
